worker_processes 1;
pid logs/nginx.pid;
error_log logs/nginx-error.log;
events { worker_connections 256; }
http {
    include runtime/nginx-1.30.6/conf/mime.types;
    default_type application/octet-stream;
    log_format cache '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log logs/access.log cache;
    server {
        listen 127.0.0.1:18766;
        server_name localhost;
        root www;
        index index.html;
        error_page 404 = @download_missing;
        location / { try_files $uri $uri/ =404; }
        location @download_missing {
            proxy_pass http://127.0.0.1:18767;
            proxy_set_header Host localhost;
            proxy_connect_timeout 5s;
            proxy_read_timeout 180s;
        }
    }
}
